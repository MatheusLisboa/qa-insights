name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testes (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Rodar testes
        run: npm test

      # O dashboard publicado (docs/index.html) e os dados de exemplo (relatório e
      # histórico) precisam ser sempre o resultado do código atual. Se alguém muda
      # src/ e esquece de regenerar, o CI falha aqui. Só roda em uma versão do Node
      # para evitar diferenças de formatação entre versões do ICU.
      - name: Conferir que o dashboard e os exemplos estão atualizados
        if: matrix.node == 22
        run: |
          npm run sample
          npm run build
          if [ -n "$(git status --porcelain -- data/sample docs)" ]; then
            echo "::error::Exemplos ou docs/index.html desatualizados. Rode 'npm run sample && npm run build' e faça commit."
            git status --short -- data/sample docs
            exit 1
          fi

      - name: Guardar o dashboard gerado
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: docs/index.html
